name: Publish branch image

on:
  workflow_call:
    inputs:
      image:
        description: Image name under ghcr.io/<owner>/
        required: true
        type: string
      dockerfile:
        description: Dockerfile path relative to the repository root
        required: true
        type: string
      title:
        description: org.opencontainers.image.title label
        required: true
        type: string
      description:
        description: org.opencontainers.image.description label
        required: true
        type: string
      tag:
        description: Docker tag already sanitized from the branch name
        required: true
        type: string
      extra_build_args:
        description: Extra Dockerfile build-args, one KEY=VALUE per line
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse release tags
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Refusing invalid Docker tag '$TAG'."
            exit 1
          fi
          if [[ "$TAG" == "latest" || "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Refusing reserved release tag '$TAG'."
            exit 1
          fi

  # Native runners per architecture. QEMU made the Next.js arm64 build take
  # 30+ minutes; see the same split in release.yml.
  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ inputs.tag }}
          labels: |
            org.opencontainers.image.title=${{ inputs.title }}
            org.opencontainers.image.description=${{ inputs.description }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=branch-${{ inputs.image }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=branch-${{ inputs.image }}-${{ env.PLATFORM_PAIR }}
          build-args: ${{ inputs.extra_build_args }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ inputs.image }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ inputs.image }}-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The immutable sha tag lets deploy targets pin an exact build; the
      # branch tag moves with every push.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=sha-${{ github.sha }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:${{ inputs.tag }}
