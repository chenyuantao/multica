name: iMind Android Release

on:
  workflow_dispatch:
  push:
    branches: [main, feat/group-chat-im]
    paths:
      - imind/app/**
      - .github/workflows/imind-android-release.yml

permissions:
  contents: read

concurrency:
  group: imind-android-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        working-directory: imind/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Restore existing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.IMIND_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo '::error::Configure the existing IMIND_ANDROID_DEBUG_KEYSTORE_BASE64 signing key.'; exit 1; }
          umask 077
          python3 - <<'PY'
          import base64, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'imind-release.keystore'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'IMIND_DEBUG_KEYSTORE={path}\n')
          PY
      - name: Verify
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test --concurrency=1
      - name: Build and publish release APK
        run: bash tool/publish_android_release.sh
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/imind-release.keystore"
