<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iMind 笔记·写作 App — 设计稿 v1</title>
<style>
:root{
  --ui-bg:#2C2C2C; --ui-bg2:#383838; --ui-line:#444; --ui-text:#E6E6E6; --ui-sub:#9A9A9A;
  --canvas:#1E1E1E; --blue:#0D99FF;
  --app-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--canvas);font-family:var(--app-font);color:var(--ui-text);-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ---------- 编辑器外壳 ---------- */
#topbar{position:fixed;left:0;right:0;top:0;height:48px;background:var(--ui-bg);border-bottom:1px solid #1a1a1a;display:flex;align-items:center;padding:0 10px;z-index:20;gap:8px;user-select:none}
#topbar .logo{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:#3a3a3a}
#topbar .file{font-size:13px;display:flex;gap:6px;align-items:center;margin-left:4px}
#topbar .file b{font-weight:600}
#topbar .file span{color:var(--ui-sub)}
#topbar .tools{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.tb{height:32px;min-width:32px;padding:0 9px;border-radius:6px;border:0;background:transparent;color:var(--ui-text);display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.tb:hover{background:#3d3d3d}
.tb.on{background:var(--blue);color:#fff}
#topbar .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.play{background:var(--blue)!important;color:#fff!important;font-weight:600}
#zoomLabel{width:52px;justify-content:center}

#left,#right{position:fixed;top:48px;bottom:0;width:240px;background:var(--ui-bg);z-index:15;overflow:auto;user-select:none}
#left{left:0;border-right:1px solid #1a1a1a}
#right{right:0;border-left:1px solid #1a1a1a;width:272px}
.ph{padding:14px 16px 8px;font-size:11px;font-weight:600;color:var(--ui-text);display:flex;justify-content:space-between}
.ph span{color:var(--ui-sub);font-weight:400}
.page-row{margin:0 8px;padding:7px 10px;border-radius:6px;font-size:12px;background:#3a3a3a}
.sep{height:1px;background:var(--ui-line);margin:12px 0 4px}
.lsec{padding:8px 16px 4px;font-size:11px;color:var(--ui-sub);display:flex;gap:6px;align-items:center}
.lrow{margin:0 8px;padding:6px 10px 6px 22px;border-radius:6px;font-size:12px;display:flex;gap:8px;align-items:center;cursor:pointer;color:#d8d8d8}
.lrow svg{flex:none;color:var(--ui-sub)}
.lrow:hover{background:#363636}
.lrow.sel{background:rgba(13,153,255,.25);color:#fff}
.lrow.sel svg{color:var(--blue)}

.rp{padding:14px 16px;font-size:12px;line-height:1.65;color:#cfcfcf}
.rp h3{margin:0 0 4px;font-size:13px;color:#fff;font-weight:600}
.rp h4{margin:16px 0 6px;font-size:11px;color:var(--ui-sub);font-weight:600;letter-spacing:.3px}
.rp p{margin:0 0 6px}
.kv{display:grid;grid-template-columns:64px 1fr;gap:4px 8px;color:var(--ui-sub)}
.kv b{color:#e8e8e8;font-weight:400}
.chip{display:inline-flex;align-items:center;gap:6px;margin:3px 4px 3px 0;padding:4px 8px;border-radius:6px;background:#3a3a3a;cursor:pointer;color:#e6e6e6}
.chip:hover{background:#444}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--blue)}
.mask-item{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.mask-item s{color:#8a8a8a}
.tag-off{font-size:10px;padding:1px 6px;border-radius:4px;background:#5a2a2a;color:#ffb4b4;white-space:nowrap}
kbd{font-family:inherit;font-size:11px;background:#3a3a3a;border:1px solid #4a4a4a;border-bottom-width:2px;border-radius:4px;padding:0 5px;color:#ddd}
.short{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center}

/* ---------- 画布 ---------- */
#viewport{position:fixed;left:240px;right:272px;top:48px;bottom:0;overflow:hidden;cursor:default;
  background-color:var(--canvas);
  background-image:radial-gradient(circle,#3a3a3a 1px,transparent 1.2px);}
#viewport.grab{cursor:grab}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;--s:1}

.section{position:absolute;border-radius:16px;background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.07)}
.stitle{position:absolute;left:0;top:0;transform-origin:0 0;transform:scale(calc(1 / var(--s)));padding:12px}
.stitle span{display:inline-block;font-size:12px;font-weight:600;color:#ddd;background:#3a3a3a;border-radius:6px;padding:4px 10px;white-space:nowrap}

.frame{position:absolute;width:390px;height:844px}
.flabel{position:absolute;left:0;bottom:100%;transform-origin:0 100%;transform:scale(calc(1 / var(--s)));padding:0 0 6px 2px;font-size:12px;color:#9a9a9a;white-space:nowrap;cursor:pointer;max-width:calc(390px * var(--s));overflow:hidden;text-overflow:ellipsis}
.frame.sel .flabel{color:var(--blue)}
.phone{position:absolute;inset:0;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.05)}
.frame.sel .phone{outline:calc(2px / var(--s)) solid var(--blue);outline-offset:calc(3px / var(--s))}

#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#links path.ln{fill:none;stroke:var(--blue);stroke-width:calc(2px / var(--s));opacity:.9}
#links circle{fill:#fff;stroke:var(--blue);stroke-width:calc(2px / var(--s))}
#links.hide{display:none}
#links .hl path.ln{stroke-width:calc(3.5px / var(--s));opacity:1}

.proto [data-link]{cursor:pointer}
.proto [data-link]:hover{outline:2px solid rgba(13,153,255,.9);outline-offset:2px;border-radius:12px}

.sticky{position:absolute;width:380px;padding:26px 28px;background:#FFE58A;color:#3b3200;border-radius:4px;box-shadow:0 12px 30px rgba(0,0,0,.35);font-size:17px;line-height:1.65}
.sticky h5{margin:0 0 10px;font-size:20px}
.sticky ul{margin:0;padding-left:20px}
.sticky.blue{background:#BDE3FF;color:#06304d}

#present{position:fixed;left:50%;bottom:20px;transform:translateX(calc(-50% - 16px));z-index:16;display:flex;align-items:center;gap:4px;background:var(--ui-bg);border:1px solid #1a1a1a;border-radius:10px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.4);user-select:none}
#present .cur{font-size:12px;padding:0 10px;min-width:200px;text-align:center}
#present .cur span{color:var(--ui-sub);margin-right:6px}

/* ---------- App 视觉（移动端） ---------- */
.scr{position:absolute;inset:0;background:#F2F2F6;font-family:var(--app-font);color:#1C1C1E;overflow:hidden}
.scr.w{background:#fff}
.scr a{color:inherit;text-decoration:none}
.sb{position:relative;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 40px;font-size:16px;font-weight:600;z-index:5}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px}
.sb-r{display:flex;gap:6px;align-items:center}
.bat{width:26px;height:12.5px;border:1.4px solid rgba(0,0,0,.38);border-radius:4px;position:relative;display:inline-block}
.bat:after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:72%;background:#111;border-radius:1.5px}
.hi{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:#111;z-index:30}
.hd{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 0;height:54px;position:relative;z-index:4}
.rb{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 22px rgba(20,20,50,.07);color:#2a2a2e}
.rg{display:flex;align-items:center;height:44px;padding:0 6px;border-radius:22px;background:#fff;box-shadow:0 6px 22px rgba(20,20,50,.07);color:#2a2a2e}
.rg .ib{width:40px;height:40px;display:grid;place-items:center}
.rg .ib.off{color:#c4c4c8}
.done{height:44px;padding:0 18px;border-radius:22px;background:#fff;color:#3478F6;font-weight:600;font-size:16px;display:flex;align-items:center;box-shadow:0 6px 22px rgba(20,20,50,.07)}
.hr{display:flex;gap:10px;align-items:center}
.brand{font-size:34px;font-weight:800;letter-spacing:-.6px;padding:10px 16px 8px}

.hero{padding:70px 26px 0 30px}
.hero h1{font-size:33px;line-height:1.75;margin:0 0 34px;font-weight:700;letter-spacing:.5px}
.feat{list-style:none;margin:0;padding:0}
.feat li{display:flex;gap:14px;margin-bottom:26px;font-size:15px;line-height:1.6;color:#2b2b2e}
.feat li svg{flex:none;margin-top:2px}

.pill{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);display:flex;gap:6px;padding:5px;background:rgba(255,255,255,.92);border-radius:28px;box-shadow:0 10px 30px rgba(20,20,50,.1);z-index:6}
.pb{height:40px;padding:0 18px 0 12px;border-radius:20px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;white-space:nowrap;color:#1c1c1e}
.pb.dk{background:#23262C;color:#fff}
.pb .o{width:20px;height:20px;border-radius:50%;background:#fff;display:grid;place-items:center}
.pb .o i{width:8px;height:8px;border-radius:50%;background:#23262C}
.pb .o i.sq{border-radius:2px}
.pb .pen{width:20px;height:20px;border-radius:50%;background:#23262C;color:#fff;display:grid;place-items:center}

.list{margin:6px 16px 0;border-top:1px solid #E2E2E7}
.it{display:block;padding:15px 10px;border-bottom:1px solid #E2E2E7;position:relative}
.it .t{font-size:15.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:28px}
.it .m{display:flex;gap:12px;align-items:center;margin-top:7px;font-size:12px;color:#8E8E93}
.it .m span{display:flex;gap:4px;align-items:center}
.tg{background:#E5E5EA;color:#6c6c70;font-size:10.5px;padding:1px 6px;border-radius:4px}
.ck{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:5px;background:#E5E5EA;display:grid;place-items:center;color:#fff}
.ck.on{background:#3a3d44}
.lp{position:absolute;right:8px;top:12px;font-size:10px;color:#0D99FF;border:1px dashed #0D99FF;border-radius:4px;padding:0 4px}

.dim{position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:8}
.dim.l{background:rgba(0,0,0,.18)}
.bg{position:absolute;inset:0;pointer-events:none}
.pop{position:absolute;right:14px;top:62px;width:250px;background:rgba(250,250,252,.97);border-radius:26px;padding:10px 0;box-shadow:0 20px 50px rgba(0,0,0,.14);z-index:9;backdrop-filter:blur(20px)}
.mi{display:flex;gap:16px;align-items:center;padding:12px 26px;font-size:17px;color:#1c1c1e}
.mi svg{color:#3a3a3c}
.mi.red,.mi.red svg{color:#E5484D}

.drawer{position:absolute;left:0;top:0;bottom:0;width:318px;background:#F2F2F6;z-index:9;padding-top:0}
.drawer .hdx{display:flex;justify-content:flex-end;padding:4px 18px 0;height:54px;align-items:center}
.drawer h2{font-size:34px;margin:12px 20px 12px;font-weight:800}
.nv{display:flex;align-items:center;gap:12px;margin:0 18px;padding:13px 14px;border-radius:24px;font-size:15.5px}
.nv.on{background:#E3E3E8}
.nv .gt{margin-left:auto;color:#a5a5aa}
.nh{display:flex;align-items:center;gap:6px;margin:22px 20px 6px 38px;font-size:17px;font-weight:600}
.nh .r{margin-left:auto;color:#8e8e93}
.nline{height:1px;background:#DCDCE1;margin:8px 18px}

.fmt{display:flex;justify-content:space-between;padding:10px 24px;color:#3a3a3c}
.kb{position:absolute;left:0;right:0;bottom:0;height:342px;background:#E3E4E9;border-radius:34px 34px 46px 46px;padding:10px 6px 0;z-index:7}
.kbt{display:flex;align-items:center;gap:14px;padding:0 10px 8px;color:#3a3a3c}
.kbt .ime{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#2fb36d;font-weight:800;font-size:18px;font-style:italic}
.kbt .sp{flex:1}
.kbt .c{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center}
.kr{display:flex;gap:6px;justify-content:center;margin-bottom:11px}
.k{height:42px;flex:1;max-width:34px;background:#fff;border-radius:8px;box-shadow:0 1px 0 rgba(0,0,0,.25);display:grid;place-items:center;font-size:20px;color:#111}
.k.g{background:#ADB2BC;max-width:none;flex:none;width:44px}
.k.w{max-width:none}
.kr.b{padding:0 2px}
.kb .gl{display:flex;justify-content:space-between;padding:6px 26px 0;color:#333}

.ed{padding:6px 20px;font-size:16px;line-height:1.75;color:#2a2a2e}
.ed h1{font-size:22px;margin:4px 0 10px;line-height:1.4}
.ed h2{font-size:18px;margin:14px 0 4px}
.ed p{margin:0 0 10px}
.ed ul{margin:0 0 10px;padding-left:20px}
.caret{display:inline-block;width:2px;height:19px;background:#3478F6;vertical-align:-4px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.rt{display:flex;justify-content:space-between;align-items:center;padding:6px 20px;height:44px}
.live{display:flex;align-items:center;gap:10px;font-size:15px;font-variant-numeric:tabular-nums}
.live i{width:12px;height:12px;border-radius:50%;background:#3478F6;box-shadow:0 0 0 4px rgba(52,120,246,.18);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(52,120,246,.05)}}
.rt .ic{display:flex;gap:22px;color:#3a3a3c}
.tr{padding:14px 20px;font-size:16px;line-height:1.6}
.tr p{margin:0 0 22px}
.tr p.pt{color:#8e8e93}
.wave{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.wave b{width:3px;border-radius:2px;background:#3478F6;animation:wv 1s infinite ease-in-out}
.wave b:nth-child(1){height:8px}.wave b:nth-child(2){height:14px;animation-delay:.15s}.wave b:nth-child(3){height:10px;animation-delay:.3s}.wave b:nth-child(4){height:16px;animation-delay:.45s}
@keyframes wv{50%{transform:scaleY(.4)}}

.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;z-index:9;box-shadow:0 -10px 40px rgba(0,0,0,.12)}
.grab-h{width:38px;height:5px;border-radius:3px;background:#D8D8DD;margin:8px auto 0}

.dlg{position:absolute;left:20px;right:20px;top:330px;background:#F2F2F6;border-radius:16px;padding:26px 28px 28px;z-index:9;text-align:center}
.dlg .q{font-size:17px;color:#555;margin-bottom:24px}
.dlg .bt{display:flex;gap:14px}
.dlg .bt a{flex:1;height:48px;border-radius:8px;background:#fff;display:grid;place-items:center;font-size:17px;font-weight:700}
.dlg .bt a.pri{color:#3478F6}

.dt h1{font-size:22px;line-height:1.4;margin:10px 20px 18px;font-weight:800}
.tabs{display:flex;gap:22px;padding:0 20px;font-size:15px;color:#8e8e93}
.tabs a{position:relative;padding-bottom:8px}
.tabs a.on{color:#1c1c1e;font-weight:700}
.tabs a.on:after{content:"";position:absolute;left:2px;right:2px;bottom:0;height:2.5px;border-radius:2px;background:#1c1c1e}
.ts{padding:18px 20px 0}
.ts .tm{font-size:12.5px;color:#a0a0a5;margin:0 0 8px}
.ts .tx{font-size:15.5px;line-height:1.6;margin:0 0 20px}
.ts .tx.cur{font-weight:700}
.sbar{position:absolute;right:12px;top:350px;width:3px;height:520px;background:#EDEDF0;border-radius:2px}
.sbar i{position:absolute;left:-1px;top:0;width:5px;height:56px;background:#2a2d33;border-radius:3px}

.flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#E5484D;background:#FDECEC;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.card{margin:14px 20px 0;padding:14px 16px;border-radius:14px;background:#F6F6F9}
.card h5{margin:0 0 6px;font-size:13px;color:#8e8e93;font-weight:600;display:flex;gap:6px;align-items:center}
.card p,.card li{font-size:15px;line-height:1.65;margin:0}
.card ul{margin:0;padding-left:18px}
.todo{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.5;margin:6px 0}
.todo i{flex:none;width:18px;height:18px;border-radius:5px;border:1.6px solid #c4c4c8;margin-top:2px}
.todo em{font-style:normal;color:#8e8e93;font-size:12.5px;margin-left:4px}

.bubble{max-width:290px;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.6;margin:0 0 14px}
.bubble.me{margin-left:auto;background:#23262C;color:#fff;border-bottom-right-radius:6px}
.bubble.ai{background:#F2F2F6;border-bottom-left-radius:6px}
.cite{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:#3478F6;background:#E8F0FE;border-radius:4px;padding:0 6px;margin:0 2px}
.inp{position:absolute;left:16px;right:16px;bottom:40px;height:50px;border-radius:25px;background:#fff;box-shadow:0 6px 24px rgba(20,20,50,.1);display:flex;align-items:center;padding:0 6px 0 18px;color:#a0a0a5;font-size:15px;gap:8px;z-index:6}
.inp .voice-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inp .voice-text.has-text{color:#2a2a2e}
.inp button{border:0;font:inherit;cursor:pointer;padding:0}
.inp .voice{width:38px;height:38px;border-radius:50%;background:#F2F2F6;color:#3a3a3c;display:grid;place-items:center;flex:none;transition:.18s ease}
.inp .voice.on{background:#E5484D;color:#fff;box-shadow:0 0 0 5px rgba(229,72,77,.14);animation:voicePulse 1.3s ease-in-out infinite}
.inp .send{margin-left:auto;width:38px;height:38px;border-radius:50%;background:#23262C;color:#fff;display:grid;place-items:center}
@keyframes voicePulse{50%{box-shadow:0 0 0 9px rgba(229,72,77,.05)}}

.ai-h{display:flex;align-items:center;gap:8px;padding:16px 22px 4px;font-size:18px;font-weight:700}
.ai-h .x{margin-left:auto;width:32px;height:32px;border-radius:50%;background:#F2F2F6;display:grid;place-items:center;color:#555}
.ai-sub{padding:0 22px;font-size:13px;color:#8e8e93}
.ai-g{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px}
.ai-g a{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border-radius:14px;background:#F6F6F9;font-size:15px;font-weight:500}
.ai-g a svg{color:#6E56CF}
.ai-chat{padding:16px 20px 86px;overflow:hidden}
.ai-chat .bubble{font-size:14px;margin-bottom:10px}
.ai-panel{height:75%}
.ai-panel .ai-chat{max-height:calc(100% - 92px);overflow:auto}
.ai-sheet-input{left:20px;right:20px;bottom:24px;background:#F6F6F9;box-shadow:none}
.grad{background:linear-gradient(135deg,#6E56CF,#3478F6);-webkit-background-clip:text;background-clip:text;color:transparent}

.field{margin:16px 20px 0;height:52px;border-radius:14px;background:#F2F2F6;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:15px;color:#3a3a3c}
.btn{margin:18px 20px 0;height:52px;border-radius:26px;background:#23262C;color:#fff;display:grid;place-items:center;font-size:16px;font-weight:600}
.scr a.btn{color:#fff}

.bbar{position:absolute;left:16px;right:16px;bottom:40px;height:72px;border-radius:24px;background:#fff;box-shadow:0 8px 30px rgba(20,20,50,.08);display:flex;justify-content:space-around;align-items:center;z-index:6}
.bbar a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#2a2a2e}
.bbar a.red{color:#E5484D}
.disabled{color:#c4c4c8!important;opacity:.55;pointer-events:none}
.tag-pop{position:absolute;left:62px;bottom:128px;width:266px;padding:10px 0;background:rgba(255,255,255,.98);border-radius:24px;box-shadow:0 14px 42px rgba(20,20,50,.14);z-index:9}
.tag-pop a{height:56px;padding:0 24px;display:flex;align-items:center;gap:15px;font-size:17px;color:#1c1c1e}
.tag-pop .tag-state{width:24px;display:grid;place-items:center;color:#0D99FF;flex:none}

let LINKS = [];
function collectLinks(){
  LINKS = [];
  FRAMES.forEach(f=>{
    document.querySelectorAll(`#f-${f.id} [data-link]`).forEach(el=>{
      if(!FM[el.dataset.link]) return;
      LINKS.push({from:f.id, to:el.dataset.link, el, line: el.dataset.line!=='0'});
    });
  });
}
function drawLinks(){
  const o = world.getBoundingClientRect();
  let out = '';
  LINKS.filter(l=>l.line).forEach((l,idx)=>{
    const r = l.el.getBoundingClientRect();
    const x1 = (r.left + r.width/2 - o.left)/st.s, y1 = (r.top + r.height/2 - o.top)/st.s;
    const src = FM[l.from], t = FM[l.to];
    const L=t.x, R=t.x+390, T=t.y, B=t.y+844;
    const sameRow = Math.abs(src.y - t.y) < 10;
    let d, x2, y2;
    if (sameRow && t.x > src.x && t.x - src.x <= C+1){
      x2=L; y2=Math.min(Math.max(y1, T+60), B-60);
      const k=(x2-x1)*.5; d=`M${x1} ${y1} C ${x1+k} ${y1}, ${x2-k} ${y2}, ${x2} ${y2}`;
    } else if (sameRow && t.x < src.x && src.x - t.x <= C+1){
      x2=R; y2=Math.min(Math.max(y1, T+60), B-60);
      const k=(x1-x2)*.5; d=`M${x1} ${y1} C ${x1-k} ${y1}, ${x2+k} ${y2}, ${x2} ${y2}`;
    } else if (sameRow){
      x2=t.x+195; y2=T; const h=170+Math.abs(x2-x1)*.08;
      const cy=Math.min(y1,T)-h; d=`M${x1} ${y1} C ${x1} ${cy}, ${x2} ${cy}, ${x2} ${y2}`;
    } else if (t.y > src.y){
      x2=t.x+195; y2=T; const m=(T-y1)*.55;
      d=`M${x1} ${y1} C ${x1} ${y1+m}, ${x2} ${T-m}, ${x2} ${y2}`;
    } else {
      x2=t.x+195; y2=B; const m=(y1-B)*.55;
      d=`M${x1} ${y1} C ${x1} ${y1-m}, ${x2} ${B+m}, ${x2} ${y2}`;
    }
    out += `<g data-from="${l.from}" data-to="${l.to}"><path class="ln" d="${d}" marker-end="url(#arw)"/><circle cx="${x1}" cy="${y1}" r="${4/st.s}"/></g>`;
  });
  linkG.innerHTML = out;
}

/* ================= 视图变换 ================= */
const st = {x:0,y:0,s:1};
const zoomLabel = document.getElementById('zoomLabel');
function apply(){
  world.style.transform = `translate(${st.x}px,${st.y}px) scale(${st.s})`;
  world.style.setProperty('--s', st.s);
  let g = 24*st.s; while(g<10) g*=4;
  view.style.backgroundSize = `${g}px ${g}px`;
  view.style.backgroundPosition = `${st.x}px ${st.y}px`;
  zoomLabel.textContent = Math.round(st.s*100)+'%';
  linkG.querySelectorAll('circle').forEach(c=>c.setAttribute('r', 4/st.s));
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function zoomAt(cx,cy,f){
  const ns = clamp(st.s*f, .04, 4);
  st.x = cx-(cx-st.x)*ns/st.s; st.y = cy-(cy-st.y)*ns/st.s; st.s = ns; apply();
}
let anim=null;
function flyTo(tx,ty,ts,dur=550){
  cancelAnimationFrame(anim);
  const a={...st}, t0=performance.now();
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const step=now=>{
    const p=Math.min(1,(now-t0)/dur), e=ease(p);
    const s = Math.exp(Math.log(a.s)+(Math.log(ts)-Math.log(a.s))*e);
    // 让世界坐标中心平滑插值
    const vw=view.clientWidth, vh=view.clientHeight;
    const ca={x:(vw/2-a.x)/a.s, y:(vh/2-a.y)/a.s}, cb={x:(vw/2-tx)/ts, y:(vh/2-ty)/ts};
    const cx=ca.x+(cb.x-ca.x)*e, cy=ca.y+(cb.y-ca.y)*e;
    st.s=s; st.x=vw/2-cx*s; st.y=vh/2-cy*s; apply();
    if(p<1) anim=requestAnimationFrame(step);
  };
  anim=requestAnimationFrame(step);
}
function fitRect(x,y,w,h,pad=80,max=1.2){
  const vw=view.clientWidth, vh=view.clientHeight;
  const s=Math.min((vw-pad*2)/w,(vh-pad*2)/h,max);
  return {x:vw/2-(x+w/2)*s, y:vh/2-(y+h/2)*s, s};
}
function flyToFrame(id){const f=FM[id]; const r=fitRect(f.x-20,f.y-40,430,904,60,1.1); flyTo(r.x,r.y,r.s); cur=f.i; updatePresent(); history.replaceState(null,'','#'+id);}
function fitAll(animate=true){
  const xs=[...SECTIONS.map(s=>s.x),...STICKIES.map(s=>s.x)], ys=SECTIONS.map(s=>s.y);
  const x0=Math.min(...xs), y0=Math.min(...ys), x1=Math.max(...SECTIONS.map(s=>s.x+s.w)), y1=Math.max(...SECTIONS.map(s=>s.y+s.h));
  const r=fitRect(x0,y0,x1-x0,y1-y0,40);
  animate?flyTo(r.x,r.y,r.s):(Object.assign(st,r),apply());
}

/* ================= 交互 ================= */
let protoOn=true, handTool=false, spaceDown=false;
let drag=null;
view.addEventListener('pointerdown', e=>{
  if(e.button!==0 && e.button!==1) return;
  cancelAnimationFrame(anim);
  drag={sx:e.clientX, sy:e.clientY, x:st.x, y:st.y, moved:false, target:e.target};
  view.setPointerCapture(e.pointerId);
});
view.addEventListener('pointermove', e=>{
  if(!drag) return;
  const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
  if(!drag.moved && Math.hypot(dx,dy)>3){drag.moved=true; view.classList.add('panning');}
  if(drag.moved){st.x=drag.x+dx; st.y=drag.y+dy; apply();}
});
view.addEventListener('pointerup', e=>{
  if(!drag) return;
  view.classList.remove('panning');
  if(!drag.moved && !handTool && !spaceDown){
    const hs = protoOn && drag.target.closest('[data-link]');
    if(hs && FM[hs.dataset.link]){ select(hs.dataset.link); flyToFrame(hs.dataset.link); }
    else { const fr=drag.target.closest('.frame'); select(fr?fr.id.slice(2):null); }
  }
  drag=null;
});
view.addEventListener('dblclick', e=>{const fr=e.target.closest('.frame'); if(fr && !e.target.closest('[data-link]')) flyToFrame(fr.id.slice(2));});
view.addEventListener('wheel', e=>{
  e.preventDefault(); cancelAnimationFrame(anim);
  const r=view.getBoundingClientRect();
  if(e.ctrlKey||e.metaKey){ zoomAt(e.clientX-r.left, e.clientY-r.top, Math.exp(-e.deltaY*(e.ctrlKey&&!e.metaKey?0.012:0.004))); }
  else { st.x-=e.deltaX; st.y-=e.deltaY; apply(); }
},{passive:false});
let gs=1;
view.addEventListener('gesturestart', e=>{e.preventDefault(); gs=1;});
view.addEventListener('gesturechange', e=>{e.preventDefault(); const r=view.getBoundingClientRect(); zoomAt(e.clientX-r.left, e.clientY-r.top, e.scale/gs); gs=e.scale;});

const setTool = hand => {handTool=hand; document.getElementById('toolHand').classList.toggle('on',hand); document.getElementById('toolMove').classList.toggle('on',!hand); view.classList.toggle('grab',hand);};
document.getElementById('toolMove').onclick=()=>setTool(false);
document.getElementById('toolHand').onclick=()=>setTool(true);
const setProto = on => {protoOn=on; svgLinks.classList.toggle('hide',!on); view.classList.toggle('proto',on); document.getElementById('toolProto').classList.toggle('on',on);};
document.getElementById('toolProto').onclick=()=>setProto(!protoOn);
const centerZoom=f=>zoomAt(view.clientWidth/2, view.clientHeight/2, f);
document.getElementById('zoomIn').onclick=()=>centerZoom(1.25);
document.getElementById('zoomOut').onclick=()=>centerZoom(.8);
zoomLabel.onclick=()=>fitAll();

window.addEventListener('keydown', e=>{
  if(e.code==='Space'){spaceDown=true; view.classList.add('grab'); e.preventDefault(); return;}
  if(e.shiftKey && e.code==='Digit1'){fitAll(); return;}
  if(e.shiftKey && e.code==='Digit0'){const vw=view.clientWidth,vh=view.clientHeight,cx=(vw/2-st.x)/st.s,cy=(vh/2-st.y)/st.s; flyTo(vw/2-cx,vh/2-cy,1); return;}
  if(e.shiftKey && e.code==='Digit2' && selected){flyToFrame(selected); return;}
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){go(1); e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){go(-1); e.preventDefault();}
  else if(e.key==='p'||e.key==='P') setProto(!protoOn);
  else if(e.key==='v'||e.key==='V') setTool(false);
  else if(e.key==='h'||e.key==='H') setTool(true);
  else if(e.key==='='||e.key==='+') centerZoom(1.25);
  else if(e.key==='-') centerZoom(.8);
  else if(e.key==='Escape') select(null);
});
window.addEventListener('keyup', e=>{if(e.code==='Space'){spaceDown=false; if(!handTool) view.classList.remove('grab');}});

/* ================= 选中 & 检查器 ================= */
let selected=null;
const insp=document.getElementById('inspector');
function select(id){
  selected=id;
  document.querySelectorAll('.frame.sel').forEach(n=>n.classList.remove('sel'));
  document.querySelectorAll('.lrow.sel').forEach(n=>n.classList.remove('sel'));
  linkG.querySelectorAll('g').forEach(g=>g.classList.toggle('hl', !!id && (g.dataset.from===id||g.dataset.to===id)));
  if(id){
    document.getElementById('f-'+id).classList.add('sel');
    const lr=document.querySelector(`.lrow[data-f="${id}"]`); lr.classList.add('sel'); lr.scrollIntoView({block:'nearest'});
  }
  renderInspector();
}
const uniq = a => [...new Set(a)];
function renderInspector(){
  if(!selected){
    insp.innerHTML = `<h3>iMind 笔记·写作 App</h3>
      <p style="color:var(--ui-sub)">移动端高保真设计稿，基于现有 App 截图重绘，按三条主流程排布 ${FRAMES.length} 个画板，蓝色连线为原型跳转关系。</p>
      <h4>画板</h4><div class="kv"><span>尺寸</span><b>390 × 844（iPhone 15 / 16）</b><span>分区</span><b>${SECTIONS.length} 个流程</b><span>跳转</span><b>${LINKS.filter(l=>l.line).length} 条连线 · ${LINKS.length} 个热区</b></div>
      <h4>本版屏蔽</h4>
      <div class="mask-item"><span class="tag-off">已屏蔽</span><span><s>发现</s> · 笔记洞察、智能设备、使用指南</span></div>
      <div class="mask-item"><span class="tag-off">已屏蔽</span><span><s>音频导入</s>（首页更多菜单）</span></div>
      <h4>快捷键</h4>
      <div class="short">
        <span>平移</span><span>拖拽 / 滚轮 / <kbd>空格</kbd></span>
        <span>缩放</span><span><kbd>⌘</kbd>+滚轮 · 捏合 · <kbd>+</kbd><kbd>-</kbd></span>
        <span>适应全部</span><kbd>⇧1</kbd>
        <span>缩放到 100%</span><kbd>⇧0</kbd>
        <span>逐页演示</span><span><kbd>←</kbd> <kbd>→</kbd></span>
        <span>显隐连线</span><kbd>P</kbd>
        <span>聚焦画板</span><span>双击画板</span>
      </div>`;
    return;
  }
  const f=FM[selected];
  const outs=uniq(LINKS.filter(l=>l.from===selected).map(l=>l.to));
  const ins=uniq(LINKS.filter(l=>l.to===selected).map(l=>l.from));
  const chips=a=>a.length?a.map(id=>`<span class="chip" data-go="${id}"><i></i>${FM[id].name}</span>`).join(''):'<span style="color:var(--ui-sub)">无</span>';
  insp.innerHTML = `<h3>${String(f.i+1).padStart(2,'0')} ${f.name}</h3>
    <div class="kv" style="margin-top:8px"><span>分区</span><b>${SECTIONS.find(s=>s.id===f.s).name}</b><span>尺寸</span><b>390 × 844</b><span>位置</span><b>X ${f.x}　Y ${f.y}</b></div>
    <h4>说明</h4><p>${f.desc}</p>
    <h4>跳转到</h4><div>${chips(outs)}</div>
    <h4>来自</h4><div>${chips(ins)}</div>`;
}
insp.addEventListener('click', e=>{const c=e.target.closest('[data-go]'); if(c){select(c.dataset.go); flyToFrame(c.dataset.go);}});

/* ================= 演示 ================= */
let cur=-1;
const curLabel=document.getElementById('curLabel');
function updatePresent(){curLabel.innerHTML = cur<0?`<span>演示</span>按 → 从第一页开始`:`<span>${String(cur+1).padStart(2,'0')} / ${FRAMES.length}</span>${FRAMES[cur].name}`;}
function go(d){cur=clamp(cur+d,0,FRAMES.length-1); const id=FRAMES[cur].id; select(id); flyToFrame(id);}
document.getElementById('prevBtn').onclick=()=>go(-1);
document.getElementById('nextBtn').onclick=()=>go(1);
document.getElementById('playBtn').onclick=()=>{cur=-1; go(1);};

/* ================= AI+ 语音输入 ================= */
let voiceSession = null;
function finishVoice({restore=false}={}){
  if(!voiceSession) return;
  const {button,text,recognition,before,placeholder}=voiceSession;
  voiceSession=null;
  if(recognition){
    recognition.onend=null;
    recognition.onerror=null;
    try{recognition.abort();}catch(e){}
  }
  button.classList.remove('on');
  button.setAttribute('aria-label','开始语音输入');
  if(restore) text.textContent=before;
  text.classList.toggle('has-text', text.textContent!==placeholder && text.textContent!=='正在听，请说话…');
}
function startVoice(button){
  if(voiceSession) finishVoice({restore:true});
  const text=button.closest('.ai-input').querySelector('.voice-text');
  const placeholder=text.dataset.placeholder;
  const before=text.textContent;
  const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  button.classList.add('on');
  button.setAttribute('aria-label','取消语音输入');
  text.textContent='正在听，请说话…';
  text.classList.remove('has-text');

  if(!Recognition){
    voiceSession={button,text,recognition:null,before,placeholder};
    text.textContent='当前浏览器暂不支持语音输入';
    return;
  }

  const recognition=new Recognition();
  voiceSession={button,text,recognition,before,placeholder};
  recognition.lang='zh-CN';
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.onresult=e=>{
    let spoken='';
    for(let i=0;i<e.results.length;i++) spoken+=e.results[i][0].transcript;
    if(spoken){text.textContent=spoken;text.classList.add('has-text');}
  };
  recognition.onerror=e=>{
    if(e.error==='aborted') return;
    text.textContent=e.error==='not-allowed'?'请允许麦克风权限后重试':'没有听清，请再试一次';
    text.classList.remove('has-text');
    finishVoice();
  };
  recognition.onend=()=>{
    if(voiceSession?.recognition!==recognition) return;
    if(text.textContent==='正在听，请说话…') text.textContent=before;
    finishVoice();
  };
  try{recognition.start();}catch(e){text.textContent='语音输入启动失败，请重试';finishVoice();}
}
document.addEventListener('click',e=>{
  const button=e.target.closest('.voice');
  if(!button) return;
  e.preventDefault();
  e.stopPropagation();
  if(button.classList.contains('on')) finishVoice({restore:true});
  else startVoice(button);
});

/* ================= 启动 ================= */
collectLinks();
const hashId = decodeURIComponent(location.hash.slice(1));
if(FM[hashId]){ const f=FM[hashId]; Object.assign(st, fitRect(f.x-20,f.y-40,430,904,60,1.1)); apply(); cur=f.i; selected=hashId; }
else fitAll(false);
const redraw=()=>{drawLinks(); select(selected);};
(document.fonts?document.fonts.ready:Promise.resolve()).then(redraw);
redraw();
updatePresent();
</script>
